<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Die by Glory - ASCII Survival RPG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05070a;
            color: #d1d5db;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }

        #glcanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            cursor: default;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.4s ease-out;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fbbf24;
            letter-spacing: 0.25rem;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            letter-spacing: 0.15rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .progress-box {
            width: min(320px, 80vw);
            height: 14px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #d97706, #fbbf24);
            animation: pulse-progress 1.5s infinite alternate ease-in-out;
        }

        @keyframes pulse-progress {
            0% { transform: scaleX(0.15); transform-origin: left; opacity: 0.6; }
            100% { transform: scaleX(1); transform-origin: left; opacity: 1.0; }
        }

        .status-text {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #64748b;
            letter-spacing: 0.05rem;
        }

        #error-message {
            display: none;
            margin-top: 1.5rem;
            color: #ef4444;
            font-size: 0.9rem;
            max-width: 80%;
            text-align: center;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.8rem 1.2rem;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="glcanvas" tabindex="1"></canvas>

        <div id="loading-screen">
            <h1 class="title">DIE BY GLORY</h1>
            <p class="subtitle">ASCII Procedural Survival RPG</p>
            <div class="progress-box">
                <div class="progress-bar"></div>
            </div>
            <p class="status-text" id="status-text">Initializing WebAssembly engine...</p>
            <div id="error-message"></div>
        </div>
    </div>

    <!-- Macroquad WebAssembly Glue and Plugins -->
    <script src="mq_js_bundle.js?v=3"></script>
    <script>
        // Custom LocalStorage Persistent Save System for Web (itch.io)
        miniquad_add_plugin({
            register_plugin: function(importObject) {
                importObject.env.web_save_game = function(ptr, len) {
                    try {
                        const bytes = new Uint8Array(wasm_memory.buffer, ptr, len);
                        const jsonStr = new TextDecoder().decode(bytes);
                        localStorage.setItem("die_by_glory_save", jsonStr);
                        console.log("[Die by Glory] Game successfully saved to browser LocalStorage (" + len + " bytes)");
                    } catch (err) {
                        console.error("[Die by Glory] Failed to save game:", err);
                    }
                };

                importObject.env.web_load_game_len = function() {
                    try {
                        const jsonStr = localStorage.getItem("die_by_glory_save");
                        if (!jsonStr) return -1;
                        window._dieByGlorySaveData = new TextEncoder().encode(jsonStr);
                        return window._dieByGlorySaveData.length;
                    } catch (err) {
                        console.error("[Die by Glory] Failed to check save data length:", err);
                        return -1;
                    }
                };

                importObject.env.web_load_game_data = function(ptr) {
                    try {
                        if (window._dieByGlorySaveData) {
                            new Uint8Array(wasm_memory.buffer, ptr, window._dieByGlorySaveData.length).set(window._dieByGlorySaveData);
                            console.log("[Die by Glory] Savegame loaded from browser LocalStorage");
                        }
                    } catch (err) {
                        console.error("[Die by Glory] Failed to copy save data to WASM:", err);
                    }
                };

                importObject.env.web_save_exists = function() {
                    try {
                        return localStorage.getItem("die_by_glory_save") !== null ? 1 : 0;
                    } catch (err) {
                        return 0;
                    }
                };
            },
            version: 1,
            name: "die_by_glory_storage"
        });

        // Canvas focus, right-click prevention, and key handling to prevent page scrolling in itch.io iframe
        const gameCanvas = document.getElementById("glcanvas");
        const loadingScreen = document.getElementById("loading-screen");
        const statusText = document.getElementById("status-text");
        const errorMessage = document.getElementById("error-message");

        function focusCanvas() {
            if (gameCanvas) {
                gameCanvas.focus();
            }
        }

        // Prevent right-click context menu (which freezes game loop & leaves button down)
        window.addEventListener("contextmenu", function(e) {
            e.preventDefault();
            return false;
        }, { passive: false });

        if (gameCanvas) {
            gameCanvas.addEventListener("contextmenu", function(e) {
                e.preventDefault();
                return false;
            }, { passive: false });
        }

        // If user tabs away or window loses focus, reset mouse buttons in engine
        window.addEventListener("blur", function() {
            if (window.wasm_exports && window.wasm_exports.mouse_up) {
                window.wasm_exports.mouse_up(0, 0, 0);
                window.wasm_exports.mouse_up(0, 0, 1);
                window.wasm_exports.mouse_up(0, 0, 2);
            }
        });

        window.addEventListener("click", focusCanvas);
        window.addEventListener("keydown", function(e) {
            // Prevent itch.io iframe scrolling with arrow keys, space, or page up/down
            if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "PageUp", "PageDown"].includes(e.code)) {
                if (document.activeElement === gameCanvas) {
                    e.preventDefault();
                }
            }
        });

        // Hide loading screen once WASM frame loop begins
        let frameObserved = false;
        const checkLoadedInterval = setInterval(function() {
            if (window.wasm_exports && window.wasm_memory) {
                if (!frameObserved) {
                    frameObserved = true;
                    setTimeout(function() {
                        loadingScreen.style.opacity = "0";
                        setTimeout(function() {
                            loadingScreen.style.display = "none";
                            focusCanvas();
                        }, 400);
                    }, 250);
                    clearInterval(checkLoadedInterval);
                }
            }
        }, 100);

        // Load WASM binary
        statusText.textContent = "Loading WebAssembly binary...";
        try {
            load("die_by_glory.wasm");
        } catch (e) {
            console.error("WASM load error:", e);
            errorMessage.textContent = "Failed to load game: " + e.message;
            errorMessage.style.display = "block";
        }
    </script>
</body>
</html>
